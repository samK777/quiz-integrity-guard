<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Monitor</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; color: #172033; font: 14px Arial, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    label { display: block; margin: 10px 0 5px; font-weight: 600; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #cbd2df; border-radius: 6px; font: inherit; }
    button { margin-top: 10px; border: 0; color: white; background: #5b5ce2; font-weight: 600; cursor: pointer; }
    button.secondary { color: #243047; background: #e8ebf3; }
    #status { min-height: 36px; margin: 12px 0 0; color: #45516a; }
    #session, #login { display: none; }
    .hint { color: #63708a; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Exam Monitor</h1>
  <label for="backendUrl">Backend URL</label>
  <input id="backendUrl" type="url" value="http://localhost:5050" autocomplete="url">
  <section id="login">
    <form id="loginForm">
      <label for="email">Student email</label>
      <input id="email" type="email" required autocomplete="username">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button type="submit">Connect</button>
    </form>
  </section>
  <section id="session">
    <p id="account"></p>
    <label for="attempt">Active attempt</label>
    <select id="attempt"></select>
    <button id="setAttempt">Monitor this attempt</button>
    <button id="refresh" class="secondary">Refresh attempts</button>
    <button id="logout" class="secondary">Disconnect</button>
    <p class="hint">Start a quiz in the portal first. Extension events are linked to the selected in-progress attempt.</p>
  </section>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
